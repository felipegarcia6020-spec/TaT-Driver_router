<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TAT-Driver Pro | Logística Circuit & Reparto 100% Offline</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#064e3b">
</head>
<body>
    <!-- LOGIN / PIN REPARTIDOR CON SALUDO AMIGABLE -->
    <div id="auth-screen" class="auth-overlay">
        <div class="auth-card">
            <div class="brand-logo">TAT</div>
            <h2 id="greeting-title">¡Hola! Qué gusto tenerte de nuevo</h2>
            <p id="greeting-subtitle" class="quote-text">"Tu esfuerzo diario impulsa el crecimiento de cada negocio. ¡Vamos a conquistar la ruta!"</p>
            
            <div class="auth-form-group" style="margin-top:16px;">
                <label><i class="fas fa-user"></i> Nombre del Conductor / Repartidor:</label>
                <input type="text" id="driver-name" value="Juan Pablo Díaz">
                
                <label><i class="fas fa-route"></i> Código de Ruta Asignada:</label>
                <input type="text" id="driver-route-code" value="RUTA-FUSA-01">

                <label><i class="fas fa-lock"></i> PIN de Seguridad (4 dígitos):</label>
                <input type="password" id="driver-pin" value="1234" placeholder="PIN de 4 dígitos">

                <button class="btn btn-success btn-lg" onclick="loginDriver()">
                    <i class="fas fa-play"></i> INICIAR RUTA (100% OFFLINE)
                </button>
            </div>
        </div>
    </div>

    <!-- CONTENEDOR PRINCIPAL REPARTO -->
    <div id="app-container" style="display:none;"></div>

    <script src="app.js"></script>
</body>
</html>
